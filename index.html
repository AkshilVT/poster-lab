<!DOCTYPE html>
<html data-fused-theme="shell">
<head>
<meta charset="utf-8" />
<!-- Declares this page a fused app's entry — keep it near the top of <head>
     (detection reads only the first 4 KiB). -->
<meta name="fused-app" />
<!-- The fused page API version this app was authored against (see
     fused_render/fused_api_version.py). The app page offers a "Migrate"
     task when the runtime has moved past it. -->
<meta name="fused-api-version" content="1" />
<meta name="fused-app-id" content="poster-lab-0b14d618" />
<title>Poster Lab</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1013; --panel: #15181d; --panel2: #1b1f26; --hover: #22262e;
    --text: #e4e7ec; --muted: #8b93a0; --line: #262a33;
    --accent: #7c9cff; --accent-text: #0e1013; --sel: #4f8cff;
    --stage: #0a0b0d; --danger: #ff6b6b;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f2f3f5; --panel: #ffffff; --panel2: #f6f7f9; --hover: #eceef2;
    --text: #16191f; --muted: #646b78; --line: #e1e4e9;
    --accent: #3d63f0; --accent-text: #ffffff; --sel: #2f6bff;
    --stage: #e4e6ea; --danger: #d93a3a;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; margin: 0; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  ::placeholder { color: var(--muted); opacity: 1; }
  input, select, textarea, progress { accent-color: var(--accent, currentColor); }
  img, svg, video, canvas { display: block; max-width: 100%; }

  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 12px; color: var(--text); background: var(--bg); overflow: hidden;
  }
  .scroll { overflow: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .scroll::-webkit-scrollbar { width: 8px; height: 8px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  #app { display: grid; grid-template-columns: 156px minmax(0, 1fr) 300px; grid-template-rows: 44px minmax(0, 1fr); height: 100vh; }
  #bar {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 12px;
    background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0;
  }
  #bar .brand { font-weight: 700; letter-spacing: 0.01em; white-space: nowrap; }
  #bar .title { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #bar .spacer { flex: 1; }
  .seg { display: flex; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 2px; }
  .seg button { padding: 4px 9px; border-radius: 5px; color: var(--muted); white-space: nowrap; }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: var(--hover); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel2); white-space: nowrap;
  }
  .btn:hover { background: var(--hover); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  .btn.danger { color: var(--danger); }
  .iconbtn { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; color: var(--muted); }
  .iconbtn:hover { background: var(--hover); color: var(--text); }
  .iconbtn:disabled { opacity: 0.35; cursor: default; background: none; }
  .iconbtn svg, .btn svg { width: 15px; height: 15px; }
  #mixwrap { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  #mixwrap[hidden] { display: none; }
  #mix { width: 110px; }

  #shelf { background: var(--panel); border-right: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  .card { display: block; width: 100%; text-align: left; border-radius: 8px; padding: 5px; border: 1px solid transparent; }
  .card:hover { background: var(--hover); }
  .card.on { border-color: var(--sel); background: var(--hover); }
  .card img { width: 100%; height: auto; border-radius: 4px; }
  .card .cap { display: flex; justify-content: space-between; gap: 4px; margin-top: 5px; font-size: 11px; }
  .card .cap span:last-child { color: var(--muted); }
  .card.soon { opacity: 0.42; cursor: default; }
  .card.soon:hover { background: none; }
  .shelf-h { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; margin: 2px 2px -2px; }

  #stage { position: relative; overflow: hidden; background: var(--stage); }
  #frame { position: absolute; left: 0; top: 0; transform-origin: 0 0; isolation: isolate; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35); }
  #ref { position: absolute; left: 0; top: 0; width: 100%; height: 100%; max-width: none; pointer-events: none; opacity: 0; }
  #frame.v-original #ref { opacity: 1; }
  #frame.v-diff #ref { opacity: 1; mix-blend-mode: difference; }
  #selbox { position: absolute; pointer-events: none; border: 1.5px solid var(--sel); display: none; }
  #selbox.show { display: block; }
  #selbox span { position: absolute; left: -1.5px; bottom: 100%; margin-bottom: 4px; padding: 2px 6px; border-radius: 4px; background: var(--sel); color: #fff; font-size: 10.5px; white-space: nowrap; }
  #hover { position: absolute; pointer-events: none; border: 1px solid var(--sel); opacity: 0.55; display: none; }
  #split { position: absolute; top: 0; width: 0; display: none; cursor: ew-resize; }
  #split.show { display: block; }
  #split::before { content: ""; position: absolute; left: -1px; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35); }
  #split i { position: absolute; left: -14px; top: 50%; width: 28px; height: 28px; margin-top: -14px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35); }
  #split i::before, #split i::after { content: ""; position: absolute; top: 9px; border: 5px solid transparent; }
  #split i::before { left: 1px; border-right-color: #333; }
  #split i::after { right: 1px; border-left-color: #333; }
  #split .tagl, #split .tagr { position: absolute; top: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(0, 0, 0, 0.55); color: #fff; font-size: 10.5px; white-space: nowrap; }
  #split .tagl { right: 8px; }
  #split .tagr { left: 8px; }
  #hint { position: absolute; left: 0; right: 0; bottom: 8px; padding: 0 12px; text-align: center; color: var(--muted); font-size: 11px; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hint kbd { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10px; }
  #stage.dropping::after { content: "Drop on a picture layer to swap it — anywhere else to add it"; position: absolute; inset: 10px; border: 2px dashed var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--text); background: rgba(124, 156, 255, 0.08); pointer-events: none; font-size: 13px; }
  #toast { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); padding: 7px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3); display: none; white-space: nowrap; }
  #toast.show { display: flex; align-items: center; gap: 8px; }
  #toast.busy::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--muted); border-top-color: transparent; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* the poster itself — fixed colours, never themed */
  .artboard { position: relative; overflow: hidden; isolation: isolate; -webkit-user-select: none; user-select: none; }
  .artboard .layer { position: absolute; transform-origin: 50% 50%; }
  .artboard .layer.image, .artboard .layer.shape { overflow: hidden; }
  .artboard .layer img { position: absolute; max-width: none; pointer-events: none; -webkit-user-drag: none; }
  .artboard .layer.text { white-space: pre; }
  .artboard .layer.svg > svg { width: 100%; height: 100%; max-width: none; overflow: visible; }

  #side { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .sec-h { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 6px; color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; }
  #layers { flex: 0 1 auto; max-height: 42%; min-height: 120px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; }
  #layer-list { padding: 0 6px 8px; }
  .lrow { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px 0 2px; border-radius: 6px; cursor: default; position: relative; }
  .lrow:hover { background: var(--hover); }
  .lrow.on { background: color-mix(in srgb, var(--sel) 22%, transparent); }
  .lrow.off .lname, .lrow.off .kind { opacity: 0.4; }
  .lrow .eye { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); border-radius: 5px; flex: none; }
  .lrow .eye:hover { color: var(--text); background: var(--panel2); }
  .lrow .eye svg { width: 14px; height: 14px; }
  .lrow .kind { width: 22px; height: 22px; border-radius: 4px; flex: none; display: inline-flex; align-items: center; justify-content: center; background: var(--panel2); color: var(--muted); overflow: hidden; }
  .lrow .kind img { width: 100%; height: 100%; object-fit: cover; }
  .lrow .kind svg { width: 13px; height: 13px; }
  .lrow .lname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow .tag { font-size: 10px; color: var(--muted); }
  .lrow.drop-above::before, .lrow.drop-below::after { content: ""; position: absolute; left: 4px; right: 4px; height: 2px; background: var(--sel); }
  .lrow.drop-above::before { top: -1px; }
  .lrow.drop-below::after { bottom: -1px; }

  #inspector { flex: 1 1 auto; min-height: 0; padding-bottom: 16px; }
  .group { padding: 4px 12px 10px; border-bottom: 1px solid var(--line); }
  .group:last-child { border-bottom: 0; }
  .group-h { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; margin: 8px 0 8px; }
  .ihead { padding: 12px 12px 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .ihead b { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .ihead span { color: var(--muted); white-space: nowrap; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; min-width: 0; }
  .row > label { width: 64px; flex: none; color: var(--muted); }
  .row > .ctl { flex: 1; min-width: 0; display: flex; gap: 6px; align-items: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; margin-bottom: 7px; }
  .num { display: flex; align-items: center; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; height: 26px; min-width: 0; }
  .num b { width: 20px; flex: none; text-align: center; color: var(--muted); font-weight: 500; font-size: 10.5px; cursor: ew-resize; -webkit-user-select: none; user-select: none; }
  .num input { flex: 1; min-width: 0; width: 100%; background: none; border: 0; outline: none; height: 24px; padding: 0 6px 0 0; font-variant-numeric: tabular-nums; }
  .field { width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; outline: none; min-width: 0; }
  .field:focus, .num:focus-within { border-color: var(--accent); }
  textarea.field { resize: vertical; min-height: 54px; line-height: 1.4; }
  select.field { -webkit-appearance: none; appearance: none; height: 26px; padding: 0 22px 0 7px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 12px) 11px, calc(100% - 8px) 11px; background-size: 4px 4px, 4px 4px; background-repeat: no-repeat; }
  input[type="range"] { flex: 1; min-width: 0; }
  .val { width: 38px; flex: none; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .swatch { position: relative; width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line); flex: none; overflow: hidden; }
  .swatch input { position: absolute; inset: -6px; width: 40px; height: 40px; border: 0; padding: 0; cursor: pointer; opacity: 0; }
  .photo { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .photo .thumb { width: 64px; height: 64px; border-radius: 6px; flex: none; background: var(--panel2); border: 1px solid var(--line); overflow: hidden; }
  .photo .thumb.cut { background-color: transparent; background-image: linear-gradient(45deg, var(--line) 25%, transparent 25%, transparent 75%, var(--line) 75%), linear-gradient(45deg, var(--line) 25%, transparent 25%, transparent 75%, var(--line) 75%); background-size: 10px 10px; background-position: 0 0, 5px 5px; }
  .photo .thumb img { width: 100%; height: 100%; object-fit: contain; }
  .photo .meta { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .photo .meta small { color: var(--muted); }
  .chk { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; cursor: pointer; }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; }
  .note { color: var(--muted); line-height: 1.5; }
  .note kbd { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; padding: 0 4px; border: 1px solid var(--line); border-radius: 4px; }
  .swaplist { display: flex; flex-direction: column; gap: 8px; }
  .swapitem { display: flex; align-items: center; gap: 10px; }
  .swapitem .thumb { width: 44px; height: 44px; border-radius: 6px; flex: none; background: var(--panel2) center / cover no-repeat; border: 1px solid var(--line); }
  .swapitem .meta { flex: 1; min-width: 0; }
  .swapitem .meta div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .swapitem .meta small { color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* bare = just the poster at 1:1 (screenshots, export) */
  html.bare, html.bare body { background: transparent; }
  html.bare #app { display: block; }
  html.bare #bar, html.bare #shelf, html.bare #side, html.bare #hint, html.bare #selbox, html.bare #hover, html.bare #split, html.bare #toast { display: none !important; }
  html.bare #stage { position: static; background: transparent; overflow: visible; }
  html.bare #frame { box-shadow: none; }

  #preview { display: none; height: 100%; align-items: center; justify-content: center; gap: 14px; padding: 18px; background: var(--bg); }
  html.preview #app { display: none; }
  html.preview #preview { display: flex; }
  #preview img { max-height: 78%; max-width: 30%; width: auto; height: auto; min-width: 0; border-radius: 6px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3); }
</style>
</head>
<body>
<div id="preview"></div>
<div id="app">
  <header id="bar">
    <span class="brand">Poster Lab</span>
    <span class="title" id="title"></span>
    <span class="spacer"></span>
    <div class="seg" id="views" role="tablist" aria-label="Compare with original">
      <button data-v="remix" title="Your layered recreation (1)">Remix</button>
      <button data-v="original" title="The Pinterest original (2)">Original</button>
      <button data-v="overlay" title="Original laid over the remix (3)">Overlay</button>
      <button data-v="split" title="Drag the divider to compare (4)">Split</button>
      <button data-v="diff" title="Difference — black means identical (5)">Difference</button>
    </div>
    <label id="mixwrap" hidden><span>Opacity</span><input type="range" id="mix" min="0" max="100" step="1" /></label>
    <span class="spacer"></span>
    <button class="iconbtn" id="undo" title="Undo (⌘Z)"></button>
    <button class="iconbtn" id="redo" title="Redo (⇧⌘Z)"></button>
    <button class="btn" id="addtext" title="Add a text layer"></button>
    <button class="btn" id="addimage" title="Add a picture layer"></button>
    <button class="btn" id="reset" title="Throw away every change to this poster">Reset</button>
  </header>
  <nav id="shelf" class="scroll"></nav>
  <main id="stage">
    <div id="frame"><div id="artboard" class="artboard"></div><img id="ref" alt="" /></div>
    <div id="hover"></div>
    <div id="selbox"><span></span></div>
    <div id="split"><i></i><span class="tagl">Original</span><span class="tagr">Remix</span></div>
    <div id="hint">Click to select · click again for the layer below · drag to move · <kbd>⌥</kbd>-drag to pan a photo · drop an image to swap it</div>
    <div id="toast"></div>
  </main>
  <aside id="side">
    <section id="layers">
      <div class="sec-h"><span>Layers</span><span id="layercount"></span></div>
      <div id="layer-list" class="scroll"></div>
    </section>
    <section id="inspector" class="scroll"></section>
  </aside>
</div>
<input type="file" id="filepick" accept="image/*" hidden />
<script>
(() => {
  "use strict";

  // ---------------------------------------------------------------- basics
  function isPreview() {
    if (new URLSearchParams(location.search).get("_preview") === "1") return true;
    try {
      let w = window;
      while (w.parent && w.parent !== w) {
        w = w.parent;
        if (new URLSearchParams(w.location.search).get("_preview") === "1") return true;
      }
    } catch (e) { /* cross-origin ancestor: the climb ends here */ }
    return false;
  }
  const $ = (sel, root = document) => root.querySelector(sel);
  function h(tag, props, ...kids) {
    const n = document.createElement(tag);
    if (props) {
      for (const [k, v] of Object.entries(props)) {
        if (v == null || v === false) continue;
        if (k === "class") n.className = v;
        else if (k === "text") n.textContent = v;
        else if (k === "html") n.innerHTML = v;
        else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
        else n.setAttribute(k, v === true ? "" : v);
      }
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid.nodeType ? kid : String(kid));
    return n;
  }
  const px = (v) => v + "px";
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const round = (v, d = 1) => Math.round(v * 10 ** d) / 10 ** d;
  const asset = (p) => (/^(data:|blob:|https?:|\/api\/)/.test(p) ? p : fused.rawUrl(p));
  const urlParams = new URLSearchParams(location.search);
  const BARE = urlParams.get("bare") === "1";
  const PURE = urlParams.get("pure") === "1"; // ignore saved changes: the poster exactly as defined

  const ICON = {
    eye: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8Z"/><circle cx="8" cy="8" r="2"/></svg>',
    eyeOff: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 2l12 12M6.6 3.7A6.6 6.6 0 0 1 8 3.5C12.1 3.5 14.5 8 14.5 8a11 11 0 0 1-1.9 2.5M10 11.9a6.4 6.4 0 0 1-2 .6C3.9 12.5 1.5 8 1.5 8a11.3 11.3 0 0 1 2.4-3"/></svg>',
    text: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3.5h10M8 3.5v9.5"/></svg>',
    shape: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/></svg>',
    svg: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 13.5 13.5 2.5M3 3h4M3 3v4"/><circle cx="11" cy="11" r="2.5"/></svg>',
    image: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2.5" width="12" height="11" rx="1.5"/><path d="m2.5 11 3.5-3.5 3 3 2-2 2.5 2.5"/></svg>',
    undo: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5.5 3 2.5 6l3 3"/><path d="M2.5 6h7a4 4 0 0 1 0 8H7"/></svg>',
    redo: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m10.5 3 3 3-3 3"/><path d="M13.5 6h-7a4 4 0 0 0 0 8H9"/></svg>',
    plusText: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3.5h8M6 3.5V13M11.5 9v5M9 11.5h5"/></svg>',
    plusImage: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8.5 13.5H3a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1V8"/><path d="m2.5 10.5 3-3 3 3"/><path d="M12.5 10v5M10 12.5h5"/></svg>',
  };

  // ---------------------------------------------------------------- state
  let registry = [];           // posters/index.json entries
  const defs = new Map();      // id -> poster definition (as authored)
  let cur = null;              // { id, def, remix, eff }
  let undoStack = [], redoStack = [], coalesceKey = null, coalesceAt = 0;
  let scale = 1, frameX = 0, frameY = 0;
  let drawSeq = 0;
  let lastPick = null;         // {x, y, ids, i} — click again to dig down the stack

  const getView = () => fused.params.get("view") || "remix";
  const getMix = () => { const m = parseFloat(fused.params.get("mix")); return Number.isFinite(m) ? m : 50; };
  const selId = () => fused.params.get("layer") || "";
  const setParam = (k, v) => fused.params.set(k, v == null ? "" : String(v));

  // ---------------------------------------------------------------- fonts
  let fontList = [];
  async function loadFonts() {
    try { fontList = JSON.parse(await fused.readFile("fonts/fonts.json")); } catch (e) { fontList = []; }
    const css = fontList.map((f) =>
      `@font-face{font-family:"${f.family}";src:url("${fused.rawUrl("fonts/" + f.file)}") format("woff2");` +
      `font-weight:${f.weight};font-style:${f.style};font-display:block;${f.stretch ? "font-stretch:" + f.stretch + ";" : ""}}`).join("\n");

      let id = ids[0] || "";
      // clicking the same spot again digs one layer deeper
      if (lastPick && Math.abs(lastPick.x - p.x) < 4 && Math.abs(lastPick.y - p.y) < 4 && ids.join() === lastPick.ids.join() && ids.length > 1) {
        lastPick.i = (lastPick.i + 1) % ids.length;
        id = ids[lastPick.i];
      } else if (ids.includes(selId())) {
        id = selId(); // keep the selection when grabbing it to drag
        lastPick = { x: p.x, y: p.y, ids, i: ids.indexOf(id) };
      } else {
        lastPick = { x: p.x, y: p.y, ids, i: 0 };
      }
      if (id !== selId()) setParam("layer", id);
      const L = layerById(id);
      if (!L || L.locked) return;
      st.setPointerCapture(e.pointerId);
      const sid = usesSource(L);
      const S = sid && cur.eff.sources[sid];
      drag = { id, start: p, x0: L.x || 0, y0: L.y || 0, moved: false, pan: e.altKey && !!S, sid, fx0: S ? (S.fx == null ? 0.5 : S.fx) : 0, fy0: S ? (S.fy == null ? 0.5 : S.fy) : 0 };
    });
    st.addEventListener("pointermove", (e) => {
      if (!drag) { hoverAt(e); return; }
      const dx = (e.clientX - drag.start.x) / scale, dy = (e.clientY - drag.start.y) / scale;
      if (!drag.moved && Math.hypot(dx * scale, dy * scale) < 3) return;
      drag.moved = true;
      $("#hover").style.display = "none";
      const L = layerById(drag.id);
      if (drag.pan) {
        // drag the photo inside its frame: pointer travel -> pan fractions
        const S = cur.eff.sources[drag.sid], r = srcRect(S), f = S.frame || { w: cur.eff.width, h: cur.eff.height };
        const spanX = r.w - f.w, spanY = r.h - f.h;
        S.fx = spanX > 0.5 ? Math.min(1, Math.max(0, drag.fx0 - dx / spanX)) : 0.5;
        S.fy = spanY > 0.5 ? Math.min(1, Math.max(0, drag.fy0 - dy / spanY)) : 0.5;
        for (const X of sharers(drag.sid)) rerenderLayer(X);
      } else {
        L.x = round(drag.x0 + dx, 1);
        L.y = round(drag.y0 + dy, 1);
        rerenderLayer(L);
      }
      updateSelection();
    });
    const end = () => {
      if (!drag) return;
      const d = drag;
      drag = null;
      if (!d.moved) return;
      if (d.pan) {
        const S = cur.eff.sources[d.sid];
        patchSource(d.sid, { fx: round(S.fx, 4), fy: round(S.fy, 4) });
      } else {
        const L = layerById(d.id);
        patchLayer(d.id, { x: L.x, y: L.y });
      }
    };
    st.addEventListener("pointerup", end);
    st.addEventListener("pointercancel", end);
    st.addEventListener("pointerleave", () => { $("#hover").style.display = "none"; });

    // compare divider
    const sp = $("#split");
    sp.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      sp.setPointerCapture(e.pointerId);
      const move = (ev) => {
        const st0 = st.getBoundingClientRect();
        const m = Math.min(100, Math.max(0, ((ev.clientX - st0.left - frameX) / (cur.eff.width * scale)) * 100));
        sp.style.left = px(frameX + cur.eff.width * scale * m / 100);
        $("#ref").style.clipPath = $("#ref").style.webkitClipPath = `inset(0 ${100 - m}% 0 0)`;
        sp.dataset.mix = String(Math.round(m));
      };
      const up = () => {
        sp.removeEventListener("pointermove", move);
        sp.removeEventListener("pointerup", up);
        if (sp.dataset.mix) setParam("mix", sp.dataset.mix);
      };
      sp.addEventListener("pointermove", move);
      sp.addEventListener("pointerup", up);
    });

    // drop an image: onto a picture layer = swap it, elsewhere = add it
    st.addEventListener("dragover", (e) => {
      if (![...(e.dataTransfer.types || [])].includes("Files")) return;
      e.preventDefault();
      st.classList.add("dropping");
    });
    st.addEventListener("dragleave", (e) => { if (e.target === st) st.classList.remove("dropping"); });
    st.addEventListener("drop", (e) => {
      st.classList.remove("dropping");
      const f = [...(e.dataTransfer.files || [])].find((x) => x.type.startsWith("image/"));
      if (!f || !cur) return;
      e.preventDefault();
      const ids = hitTest(e.clientX, e.clientY);
      const L = ids.map(layerById).find((x) => x && usesSource(x));
      if (L) { setParam("layer", L.id); replaceSource(usesSource(L), f); }
      else addImage(f, clientToArt(e.clientX, e.clientY));
    });
  }
  function hoverAt(e) {
    const hv = $("#hover");
    if (!cur || getView() === "original" || e.target.closest("#split")) { hv.style.display = "none"; return; }
    const id = hitTest(e.clientX, e.clientY)[0];
    const L = id && id !== selId() ? layerById(id) : null;
    const b = L && layerBounds(L);
    if (!b) { hv.style.display = "none"; return; }
    const r = toStage(b);
    Object.assign(hv.style, { display: "block", left: px(r.x), top: px(r.y), width: px(r.w), height: px(r.h) });
  }

  // ---------------------------------------------------------------- keys + chrome
  function wireChrome() {
    $("#undo").innerHTML = ICON.undo;
    $("#redo").innerHTML = ICON.redo;
    $("#addtext").innerHTML = ICON.plusText + "<span>Text</span>";
    $("#addimage").innerHTML = ICON.plusImage + "<span>Image</span>";
    $("#undo").onclick = undo;
    $("#redo").onclick = redo;
    $("#addtext").onclick = addText;
    $("#addimage").onclick = () => pickFile((f) => addImage(f));
    $("#reset").onclick = () => {
      if (!cur || !Object.keys(cur.remix).length) return;
      mutate((rx) => { for (const k of Object.keys(rx)) delete rx[k]; }, { reload: true });
      toast("Back to the recreation — ⌘Z brings your changes back");
    };
    for (const b of document.querySelectorAll("#views button")) b.onclick = () => setParam("view", b.dataset.v);
    $("#mix").addEventListener("input", (e) => { $("#ref").style.opacity = String(e.target.value / 100); });
    $("#mix").addEventListener("change", (e) => setParam("mix", e.target.value));
    $("#filepick").addEventListener("change", (e) => {
      const f = e.target.files && e.target.files[0];
      if (f && pickCb) pickCb(f);
      pickCb = null;
    });
    window.addEventListener("keydown", (e) => {
      if (!cur) return;
      const typing = e.target.closest && e.target.closest("input, textarea, select, [contenteditable]");
      const mod = e.metaKey || e.ctrlKey;
      if (mod && e.key.toLowerCase() === "z" && !typing) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
      if (typing || mod) return;
      if (e.key.length === 1 && "12345".includes(e.key)) {
        setParam("view", ["remix", "original", "overlay", "split", "diff"][+e.key - 1]);
        return;
      }
      if (e.key === "Escape") { setParam("layer", ""); return; }
      const L = layerById(selId());
      if (!L) return;
      const step = e.shiftKey ? 10 : 1;
      const nudge = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
      if (nudge) {
        e.preventDefault();
        patchLayer(L.id, { x: round((L.x || 0) + nudge[0], 1), y: round((L.y || 0) + nudge[1], 1) }, { coalesce: "nudge" + L.id });
      } else if (e.key === "[" || e.key === "]") {
        stepLayer(L.id, e.key === "]" ? 1 : -1);
      } else if (e.key === "Backspace" || e.key === "Delete") {
        e.preventDefault();
        if (L._extra) deleteLayer(L.id);
        else patchLayer(L.id, { hidden: true });
      }
    });
  }

  // ---------------------------------------------------------------- boot
  async function renderPreview() {
    document.documentElement.classList.add("preview");
    try {
      const reg = JSON.parse(await fused.readFile("posters/index.json"));
      $("#preview").replaceChildren(...reg.filter((r) => r.file).slice(0, 3).map((r) => h("img", { src: fused.rawUrl(r.ref), alt: "" })));
    } catch (e) { /* the empty placeholder is enough */ }
  }
  async function boot() {
    if (isPreview()) return renderPreview();
    if (BARE) document.documentElement.classList.add("bare");
    wireChrome();
    wireStage();
    await loadFonts();
    registry = JSON.parse(await fused.readFile("posters/index.json"));
    renderShelf();
    fused.params.onChange(draw);
    await draw();
  }
  // read-only hooks for tests and the console
  window.posterLab = {
    hitTest: (x, y) => { const f = $("#frame").getBoundingClientRect(); return hitTest(f.left + x * scale, f.top + y * scale); },
    bounds: (id) => layerBounds(layerById(id)),
    state: () => cur && { id: cur.id, layer: selId(), view: getView(), remix: clone(cur.remix), layers: cur.eff.layers.map((L) => L.id) },
  };
  boot();
})();
</script>
</body>
